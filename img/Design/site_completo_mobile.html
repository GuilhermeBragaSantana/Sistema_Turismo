<div style="max-width:360px;margin:0 auto;font-family:var(--font-sans);border:0.5px solid var(--border);border-radius:16px;overflow:hidden;">
<h2 class="sr-only">Layout mobile do site: menu, seção institucional, destinos e rodapé</h2>

<nav style="display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:#fff;border-bottom:0.5px solid var(--border);">
  <div style="font-family:var(--font-voice);font-weight:500;font-size:16px;color:#04342C;">Nome da empresa</div>
  <i class="ti ti-menu-2" style="font-size:22px;color:#04342C;" aria-hidden="true"></i>
</nav>

<div style="background:#04342C;color:#fff;padding:44px 24px;text-align:center;">
  <div style="display:flex;gap:5px;justify-content:center;margin-bottom:16px;">
    <div style="width:2px;height:22px;background:#F0997B;"></div>
    <div style="width:2px;height:16px;background:#F0997B;margin-top:6px;"></div>
    <div style="width:2px;height:28px;background:#F0997B;"></div>
  </div>
  <h1 style="font-family:var(--font-voice);font-size:22px;font-weight:500;margin:0 0 10px;line-height:1.3;">Slogan da empresa entra aqui</h1>
  <p style="font-size:12px;color:#9FE1CB;margin:0;">Frase de efeito aguardando conteúdo do cliente.</p>
</div>

<div style="background:#F9F6F1;padding:32px 18px;">
  <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px;" id="tabs3"></div>
  <div id="content3"></div>
</div>

<footer style="background:#04342C;color:#fff;padding:28px 20px 18px;">
  <div style="font-family:var(--font-voice);font-size:16px;font-weight:500;margin-bottom:14px;">Nome da empresa</div>
  <div style="font-size:12px;font-weight:500;color:#F0997B;margin:14px 0 6px;">Navegação</div>
  <div style="font-size:12px;color:#C9E8DC;line-height:2;">Início · Sobre · Destinos · Contato</div>
  <div style="font-size:12px;font-weight:500;color:#F0997B;margin:14px 0 6px;">Contato</div>
  <div style="font-size:12px;color:#C9E8DC;line-height:2;">email@empresa.com<br>(73) 0000-0000</div>
  <div style="border-top:0.5px solid rgba(255,255,255,0.15);margin-top:16px;padding-top:14px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#7FB3A0;">
    <span>© 2026 Nome da empresa.</span>
    <div style="display:flex;gap:12px;">
      <i class="ti ti-brand-linkedin" aria-hidden="true"></i>
      <i class="ti ti-brand-instagram" aria-hidden="true"></i>
    </div>
  </div>
</footer>
</div>

<script>
const data3 = {
itacare: { name:"Itacaré", desc:"Entre a mata atlântica e o mar, Itacaré esconde praias que só se chega de trilha e um pôr do sol que para o tempo.",
  photos:[{icon:"ti-sunset-2",color:"#0F6E56",fg:"#fff"},{icon:"ti-palm-tree",color:"#9FE1CB",fg:"#04342C"},{icon:"ti-droplet",color:"#5DCAA5",fg:"#04342C"},{icon:"ti-mountain",color:"#1D9E75",fg:"#fff"}]},
morro: { name:"Morro de São Paulo", desc:"Sem carros, sem pressa. As praias numeradas vão ficando mais desertas conforme você caminha.",
  photos:[{icon:"ti-anchor",color:"#F5C4B3",fg:"#4A1B0C"},{icon:"ti-beach",color:"#F0997B",fg:"#4A1B0C"},{icon:"ti-sunset-2",color:"#D85A30",fg:"#fff"},{icon:"ti-sailboat",color:"#9FE1CB",fg:"#04342C"}]},
barra: { name:"Barra Grande", desc:"Vento forte, dunas gigantes e piscinas naturais que aparecem na maré baixa.",
  photos:[{icon:"ti-wind",color:"#B5D4F4",fg:"#042C53"},{icon:"ti-kite",color:"#85B7EB",fg:"#042C53"},{icon:"ti-beach",color:"#378ADD",fg:"#fff"},{icon:"ti-mountain",color:"#F5C4B3",fg:"#4A1B0C"}]}
};
let cur3 = "itacare";
function renderTabs3(){
  const t = document.getElementById("tabs3"); t.innerHTML = "";
  Object.keys(data3).forEach(k=>{
    const b = document.createElement("button");
    b.textContent = data3[k].name;
    b.style.cssText = "padding:8px 14px;border-radius:6px;border:1px solid " + (k===cur3?"#D85A30":"#B4B2A9") + ";background:" + (k===cur3?"#D85A30":"transparent") + ";color:" + (k===cur3?"#fff":"#2C2C2A") + ";font-size:12px;font-weight:500;cursor:pointer;";
    b.onclick = () => { cur3 = k; renderTabs3(); renderContent3(); };
    t.appendChild(b);
  });
}
function renderContent3(){
  const d = data3[cur3]; const el = document.getElementById("content3"); el.innerHTML = "";
  const title = document.createElement("h3");
  title.textContent = d.name;
  title.style.cssText = "font-family:var(--font-voice);font-size:18px;font-weight:500;color:#04342C;margin:0 0 8px;text-align:center;";
  el.appendChild(title);
  const desc = document.createElement("p");
  desc.textContent = d.desc;
  desc.style.cssText = "font-size:12px;line-height:1.65;color:#5F5E5A;margin:0 0 18px;text-align:center;";
  el.appendChild(desc);
  const grid = document.createElement("div");
  grid.style.cssText = "display:grid;grid-template-columns:repeat(2,1fr);gap:8px;";
  d.photos.forEach(p=>{
    const c = document.createElement("div");
    c.style.cssText = "background:"+p.color+";border-radius:10px;height:90px;display:flex;align-items:center;justify-content:center;";
    c.innerHTML = '<i class="ti '+p.icon+'" style="font-size:26px;color:'+p.fg+';" aria-hidden="true"></i>';
    grid.appendChild(c);
  });
  el.appendChild(grid);
}
renderTabs3(); renderContent3();
</script>
